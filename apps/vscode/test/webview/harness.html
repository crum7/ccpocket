<!DOCTYPE html>
<!--
  CC Pocket webview test harness — mirrors apps/vscode/media/index.html.
  Keep the body in lockstep with media/index.html so main.js's $(id) lookups
  succeed during boot. Updated for the new sidebar + composer + popover UI.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CC Pocket — harness</title>
    <style>
      :root {
        --vscode-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --vscode-font-size: 13px;
        --vscode-foreground: #d4d4d4;
        --vscode-editor-background: #1e1e1e;
        --vscode-sideBar-background: #252526;
        --vscode-panel-border: rgba(127, 127, 127, 0.25);
        --vscode-button-background: #0e639c;
        --vscode-button-foreground: #ffffff;
        --vscode-button-hoverBackground: #1177bb;
        --vscode-input-background: #3c3c3c;
        --vscode-input-foreground: #cccccc;
        --vscode-input-border: #3c3c3c;
        --vscode-inputValidation-errorBackground: rgba(180, 60, 60, 0.18);
        --vscode-inputValidation-errorForeground: #f48771;
        --vscode-inputValidation-errorBorder: rgba(180, 60, 60, 0.4);
        --vscode-descriptionForeground: #8a8a8a;
        --vscode-textLink-foreground: #3794ff;
        --vscode-textCodeBlock-background: rgba(127, 127, 127, 0.1);
        --vscode-editor-font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        --vscode-editor-font-size: 12px;
        --vscode-diffEditor-insertedLineBackground: rgba(64, 160, 96, 0.18);
        --vscode-diffEditor-removedLineBackground: rgba(200, 70, 70, 0.18);
      }
      html, body { background: var(--vscode-editor-background); color: var(--vscode-foreground); margin: 0; height: 100%; }
    </style>
    <link rel="stylesheet" href="../../media/styles.css" />
    <script>
      window.__pwMessages = [];
      window.acquireVsCodeApi = function () {
        return {
          postMessage: function (m) { window.__pwMessages.push(m); },
          getState: function () {
            try { return JSON.parse(localStorage.getItem("cc.state") || "null"); } catch (e) { return null; }
          },
          setState: function (s) { localStorage.setItem("cc.state", JSON.stringify(s)); },
        };
      };
      window.__deliver = function (message) {
        window.dispatchEvent(new MessageEvent("message", { data: message }));
      };
      window.__pwErrors = [];
      window.addEventListener("error", function (ev) {
        window.__pwErrors.push({ message: ev.message, filename: ev.filename, lineno: ev.lineno, colno: ev.colno });
      });
      window.addEventListener("unhandledrejection", function (ev) {
        window.__pwErrors.push({ message: "unhandledrejection: " + String(ev.reason) });
      });
    </script>
  </head>
  <body>
    <div id="app" class="app">
      <aside id="sidebar" class="sidebar" aria-label="Sessions">
        <div class="sidebar-head">
          <button id="sidebar-toggle" class="sidebar-toggle icon-btn" type="button" title="Toggle sidebar" aria-label="Toggle sidebar"></button>
          <span class="sidebar-title">CC Pocket</span>
          <button id="new-session-btn" class="sidebar-new-btn icon-btn" type="button" title="New session" aria-label="New session">+ New</button>
        </div>
        <div id="sidebar-scroll" class="sidebar-scroll">
          <section class="sidebar-section" id="active-section">
            <header class="sidebar-section-head">Active session</header>
            <div id="active-card" class="active-card empty">No active session.</div>
          </section>
          <section class="sidebar-section" id="recent-section">
            <header class="sidebar-section-head">Recent sessions</header>
            <ul id="recent-list" class="sidebar-list"></ul>
          </section>
          <section class="sidebar-section" id="projects-section">
            <header class="sidebar-section-head">Projects</header>
            <ul id="projects-list" class="sidebar-list"></ul>
          </section>
        </div>
      </aside>

      <div id="sidebar-backdrop" class="sidebar-backdrop" aria-hidden="true"></div>

      <main class="main-col">
        <header class="topbar">
          <button id="topbar-sidebar-toggle" class="topbar-sidebar-toggle" type="button" title="Show sessions" aria-label="Show sessions">≡</button>
          <span id="status-dot" class="status-dot status-idle" aria-hidden="true"></span>
          <span id="status-label" class="status-label">Idle</span>
          <span id="bridge-url" class="bridge-url" title=""></span>
          <span class="topbar-spacer"></span>
          <span id="active-mini" class="active-mini" title=""></span>
          <button id="stop-btn" class="icon-btn topbar-stop" type="button" hidden>Stop</button>
          <button id="reconnect-btn" class="icon-btn topbar-reconnect" type="button" hidden>Reconnect</button>
        </header>

        <div id="banners" class="banners" aria-live="polite"></div>
        <section id="messages" class="messages" aria-live="polite" aria-label="Chat messages"></section>

        <footer class="composer" id="composer">
          <div id="chips" class="chips" hidden></div>
          <textarea id="input" class="input" rows="1" placeholder="Type a message… (⌘↵ to send)" aria-label="Message"></textarea>
          <div class="composer-row">
            <div class="composer-row-left">
              <button id="plus-btn" class="composer-icon-btn" type="button" title="Attach" aria-label="Attach"><span class="iconglyph">+</span></button>
              <button id="mic-btn" class="composer-icon-btn" type="button" title="Voice input" aria-label="Voice input"><span class="iconglyph mic" aria-hidden="true"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="4" height="7.5" rx="2"/><path d="M4 8.25a4 4 0 0 0 8 0"/><path d="M8 12.25v2"/><path d="M6 14.25h4"/></svg></span></button>
            </div>
            <div class="composer-row-right">
              <button id="mode-btn" class="mode-chip" type="button" aria-haspopup="true" aria-expanded="false">
                <span class="mode-icon" aria-hidden="true"></span>
                <span id="mode-label" class="mode-label">Edit automatically</span>
                <span class="mode-caret" aria-hidden="true">▾</span>
              </button>
              <button id="send-btn" class="send-btn" type="button" disabled aria-label="Send">
                <span class="iconglyph send" aria-hidden="true">➤</span>
              </button>
            </div>
          </div>
          <div id="plus-menu" class="popover" role="menu" hidden>
            <button class="popover-item" data-action="pick-workspace-file" type="button" role="menuitem"><span class="popover-glyph">📄</span><span>Add workspace file</span></button>
            <button class="popover-item" data-action="pick-open-editor" type="button" role="menuitem"><span class="popover-glyph">🗂</span><span>Open editor file</span></button>
            <button class="popover-item" data-action="pick-system-file" type="button" role="menuitem"><span class="popover-glyph">⬆</span><span>Upload from computer</span></button>
            <button class="popover-item" data-action="add-active-selection" type="button" role="menuitem"><span class="popover-glyph">▢</span><span>Add active selection</span></button>
          </div>
          <div id="mode-menu" class="popover popover-right" role="menu" hidden>
            <button class="popover-item" data-mode="default" type="button" role="menuitemradio"><span class="popover-check" aria-hidden="true">✓</span><span class="popover-body"><span class="popover-title">Ask before edits</span><span class="popover-sub">Confirm each tool call</span></span></button>
            <button class="popover-item" data-mode="acceptEdits" type="button" role="menuitemradio"><span class="popover-check" aria-hidden="true">✓</span><span class="popover-body"><span class="popover-title">Edit automatically</span><span class="popover-sub">Apply file edits without asking</span></span></button>
            <button class="popover-item" data-mode="plan" type="button" role="menuitemradio"><span class="popover-check" aria-hidden="true">✓</span><span class="popover-body"><span class="popover-title">Plan mode</span><span class="popover-sub">Plan before any changes</span></span></button>
            <button class="popover-item" data-mode="bypassPermissions" type="button" role="menuitemradio"><span class="popover-check" aria-hidden="true">✓</span><span class="popover-body"><span class="popover-title">Auto mode</span><span class="popover-sub">Bypass all permission prompts</span></span></button>
          </div>
        </footer>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="../../media/main.js"></script>
  </body>
</html>
